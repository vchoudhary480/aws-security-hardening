name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check scripts/ tests/

      - name: Check syntax (all scripts)
        run: python -m py_compile scripts/iam_audit.py scripts/s3_audit.py scripts/security_groups_audit.py scripts/full_audit.py

      - name: Run tests
        run: pytest tests/ -v --cov=scripts --cov-report=term-missing
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_SECURITY_TOKEN: testing
